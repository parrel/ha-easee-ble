name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  hassfest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    # Manual-only until the repo has topics, a description, and brands assets.
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  ruff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # Pinned so a new ruff release cannot fail main on its own.
      - name: Install ruff
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.6"
          args: "--version"
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          pip install -r requirements-test.txt
          scripts/install-deps
      - name: Run tests
        run: pytest --cov=custom_components.easee_ble --cov-report=term-missing
